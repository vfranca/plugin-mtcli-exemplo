[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-mtcli-exemplo"
version = "0.1.0"
description = "Exemplo de plugin mtcli"
authors = [
    { name = "Valmir França da Silva", email = "vfranca3@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"

keywords = [
    "trading",
    "metatrader5",
    "mt5",
    "cli",
    "accessibility",
    "acessibilidade",
    "screen reader friendly"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "mtcli>=3.5.0",
    "click>=8.3.0,<9.0.0",
    "metatrader5>=5.0.5370,<6.0.0",
]

[dependency-groups]
dev = [
    "build>=1.2.2",
    "twine>=6.2.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.1",
    "prek>=0.5.7",
]

[project.urls]
Homepage = "https://github.com/vfranca/plugin-mtcli-exemplo"
Repository = "https://github.com/vfranca/plugin-mtcli-exemplo"
Issues = "https://github.com/vfranca/plugin-mtcli-exemplo/issues"
Documentation = "https://vfranca.github.io/plugin-mtcli-exemplo"

[project.entry-points."mtcli.plugins"]
mtcli-exemplo = "plugin_mtcli_exemplo.plugin:register"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mtcli", "plugin_mtcli_exemplo"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

# Hooks de qualidade do projeto plugin-mtcli-exemplo.

minimum_prek_version = "0.5.7"

# Ferramentas locais de qualidade de código.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-check"
name = "Ruff check"
entry = "ruff check"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format"
entry = "ruff format --check"
language = "system"
types = ["python"]

# Hooks internos do prek.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "no-commit-to-branch"
name = "Bloqueia commits em main e master"
args = [
    "--branch", "main",
    "--branch", "master",
]
